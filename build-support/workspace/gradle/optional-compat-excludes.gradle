    exclude 'com/sorrowmist/useless/content/recipe/adapters/oritech/**'
    exclude 'com/sorrowmist/useless/content/recipe/adapters/justdirethings/**'
    exclude 'com/sorrowmist/useless/content/recipe/adapters/ae/dataenergistics/**'
