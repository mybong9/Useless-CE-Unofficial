    exclude 'com/sorrowmist/useless/compat/ufo/**'
    exclude 'com/sorrowmist/useless/content/recipe/adapters/ufo/**'
    exclude 'com/sorrowmist/useless/compat/modernindustrialization/**'
}

// Extra Delight and Barbeque's Delight are excluded at the user's request.
// Expanded Delight and Nomad's Delight have no supported Forge 1.20.1 API here.
sourceSets.main.java {
    exclude 'com/sorrowmist/useless/compat/extradelight/**'
    exclude 'com/sorrowmist/useless/content/recipe/adapters/delight/extradelight/**'
    exclude 'com/sorrowmist/useless/compat/expandeddelight/**'
    exclude 'com/sorrowmist/useless/content/recipe/adapters/delight/expandeddelight/**'
    exclude 'com/sorrowmist/useless/compat/nomadsdelight/**'
    exclude 'com/sorrowmist/useless/content/recipe/adapters/delight/nomadsdelight/**'
    exclude 'com/sorrowmist/useless/compat/barbequesdelight/**'
    exclude 'com/sorrowmist/useless/content/recipe/adapters/delight/barbequesdelight/**'
}

// Botany Pots 13 uses BlockEntityBotanyPot; the original 1.20.1 implementation is active.
sourceSets.main.java {
    exclude 'com/sorrowmist/useless/mixin/botanypots/AbstractBotanyPotBlockEntityAccessor.java'
    exclude 'com/sorrowmist/useless/mixin/botanypots/BotanyPotBlockEntityAccessor.java'
    exclude 'com/sorrowmist/useless/mixin/botanypots/BotanyPotBlockEntityMixin.java'
}

// The crystal assembler does not exist in ExtendedAE's Forge 1.20.1 release.
sourceSets.main.java.exclude 'com/sorrowmist/useless/content/recipe/adapters/ae/extendedae/CrystalAssemblerRecipeAdapter.java'

// Ender IO 6.2.18 for Forge 1.20.1 has no Vat machine or fermentation recipe type.
sourceSets.main.java.exclude 'com/sorrowmist/useless/content/recipe/adapters/enderio/VatFermentingRecipeAdapter.java'
